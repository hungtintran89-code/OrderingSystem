spring.application.name=backend


# 2. Cấu hình Hibernate và JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_batch_fetch_size=25




# 3. Cấu hình PostgesSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/QrOrderingSystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}



# Hiển thị màu sắc Log cho dễ đọc
spring.output.ansi.enabled=ALWAYS


# Bật Log chi tiết cho gói package dự án của bạn
logging.level.ordersystem.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

#Chuẩn hóa các quy ước đặt tên
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# Tự động cập nhật (repair) checksum và bỏ qua Validate mismatch khi khởi chạy app
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/QrOrderingSystem}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:12345}
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

# REDIS CONFIGURATION (Kết nối tới Docker Container localhost:6379)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}
# Cấu hình Cache thời gian sống mặc định (ví dụ: 10 phút)
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# CẤU HÌNH DOMAIN & BẢO MẬT CORS
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}
app.qr.base-url=${APP_QR_BASE_URL:http://localhost:8080/api/v1/qr/resolve/}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}


# CẤU HÌNH NGÂN HÀNG THỤ HƯỞNG VIETQR / PAYOS
app.payment.bank-code=${BANK_CODE:MB}
app.payment.account-no=${BANK_ACCOUNT_NO:0866739857}
app.payment.account-name=${BANK_ACCOUNT_NAME:TRAN HUNG TIN}

# CẤU HÌNH PAYOS API KEYS QUA ENVIRONMENT VARIABLES HOẶC DATABASE
payos.client-id=${PAYOS_CLIENT_ID:PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY:PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:PAYOS_CHECKSUM_KEY}