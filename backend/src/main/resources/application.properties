spring.application.name=backend


# 2. Cấu hình Hibernate và JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# 2. Bật Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# 3. Cấu hình PostgesSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/QrOrderingSystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

# Hiển thị màu sắc Log cho dễ đọc
spring.output.ansi.enabled=ALWAYS


# Bật Log chi tiết cho gói package dự án của bạn
logging.level.ordersystem.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Chuẩn hóa các quy ước đặt tên
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy